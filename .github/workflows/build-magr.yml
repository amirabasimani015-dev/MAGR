name: Build MAGR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Brand MAGR (API keys, name, package)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          BV=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${API_ID};/" $BV
          sed -i "s/APP_HASH = \"[^\"]*\";/APP_HASH = \"${API_HASH}\";/" $BV
          sed -i 's/applicationId "[^"]*"/applicationId "com.magr.messenger"/' TMessagesProj_App/build.gradle
          sed -i 's|<string name="AppName">[^<]*</string>|<string name="AppName">MAGR Messenger</string>|' TMessagesProj/src/main/res/values/strings.xml
          echo '{"project_info":{"project_number":"1","project_id":"magr","storage_bucket":"magr.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.magr.messenger"}},"api_key":[{"current_key":"x"}]}],"configuration_version":"1"}' > TMessagesProj_App/google-services.json
          grep -n "applicationId" TMessagesProj_App/build.gradle
          grep -n "AppName" TMessagesProj/src/main/res/values/strings.xml | head -3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MAGR-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
